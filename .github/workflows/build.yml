name: Build Homecoming

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: homecoming
        run: bash ./gradlew build --no-daemon --max-workers=2
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: homecoming-1.21.1-neoforge
          path: homecoming/build/libs/*.jar
          if-no-files-found: error
