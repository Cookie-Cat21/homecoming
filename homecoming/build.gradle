plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0'
group = 'dev.homecoming'
base { archivesName = 'homecoming' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}
neoForge {
    enable {
        version = '21.1.265'
        disableRecompilation = true
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { homecoming { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly('dev.ftb.mods:ftb-quests-neoforge:2101.1.37') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-teams-neoforge:2101.1.9') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library-neoforge:2101.1.36') { transitive = false }
    compileOnly('dev.architectury:architectury-neoforge:13.0.8') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
