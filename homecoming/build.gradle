plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.2.0-alpha.2'
group = 'dev.homecoming'
base { archivesName = 'homecoming' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://chocolateminecraft.com/maven' }
}
if (project.hasProperty('runtimeChecks')) {
    sourceSets.main.java.srcDir 'src/runtimeChecks/java'
    sourceSets.main.resources.srcDir 'src/runtimeChecks/resources'
}
neoForge {
    enable {
        version = project.findProperty('neoForgeVersion') ?: '21.1.265'
        disableRecompilation = true
    }
    runs {
        client {
            client()
            if (project.hasProperty('pilotDirectory')) {
                gameDirectory = file(project.property('pilotDirectory'))
                jvmArgument '-Xmx6G'
                systemProperty 'neoforge.enableGameTest', 'false'
            }
            if (project.hasProperty('clientChecks')) systemProperty 'homecoming.clientChecks', 'true'
            if (project.hasProperty('previewJournal')) {
                systemProperty 'homecoming.previewJournal', 'true'
                programArgument '--width'; programArgument '960'
                programArgument '--height'; programArgument '800'
            }
            if (project.hasProperty('testWorld')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('testWorld').toString()
            }
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'homecoming'
        }
    }
    mods { homecoming { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly('dev.ftb.mods:ftb-quests-neoforge:2101.1.37') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-teams-neoforge:2101.1.9') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library-neoforge:2101.1.36') { transitive = false }
    compileOnly('dev.architectury:architectury-neoforge:13.0.8') { transitive = false }
    compileOnly('xaero.minimap:xaerominimap-neoforge-1.21.1:26.6.0') { transitive = false }
    if (project.hasProperty('withFtb')) {
        runtimeOnly('dev.ftb.mods:ftb-quests-neoforge:2101.1.37') { transitive = false }
        runtimeOnly('dev.ftb.mods:ftb-teams-neoforge:2101.1.9') { transitive = false }
        runtimeOnly('dev.ftb.mods:ftb-library-neoforge:2101.1.36') { transitive = false }
        runtimeOnly('dev.architectury:architectury-neoforge:13.0.8') { transitive = false }
    }
    if (project.hasProperty('withXaero')) {
        if (project.hasProperty('xaeroDistribution')) {
            runtimeOnly files(project.property('xaeroDistribution'))
        } else {
            runtimeOnly('xaero.minimap:xaerominimap-neoforge-1.21.1:26.6.0') { transitive = false }
            runtimeOnly('xaero.lib:xaerolib-neoforge-1.21.1:1.7.3') { transitive = false }
        }
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
